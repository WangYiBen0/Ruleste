[package]
name = "ruleste-strawberry"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Strawberry collectible plugin — follows the player and is collected on safe ground."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
ruleste-plugin-api = { path = "../../crates/ruleste-plugin-api", features = ["plugin"] }
