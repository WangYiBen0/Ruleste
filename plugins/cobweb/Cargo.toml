[package]
name = "ruleste-cobweb"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Cobweb decoration plugin — a swaying quadratic-bezier web drawn as lines."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
ruleste-plugin-api = { path = "../../crates/ruleste-plugin-api", features = ["plugin"] }
