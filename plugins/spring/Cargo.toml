[package]
name = "ruleste-plugin-spring"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Spring entity plugin for Ruleste — validates cross-plugin interaction."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
ruleste-plugins-api = { path = "../../crates/ruleste-plugins-api", features = ["plugin"] }
