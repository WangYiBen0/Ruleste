[package]
name = "ruleste-lightbeam"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "LightBeam entity plugin — a soft shaft of light (util/lightbeam) fading near the player."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
ruleste-plugin-api = { path = "../../crates/ruleste-plugin-api", features = ["plugin"] }
