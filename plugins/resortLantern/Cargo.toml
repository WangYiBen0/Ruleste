[package]
name = "ruleste-resort-lantern"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "ResortLantern decoration plugin — a hanging lantern that sways when the player bumps into it."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
ruleste-plugin-api = { path = "../../crates/ruleste-plugin-api", features = ["plugin"] }
