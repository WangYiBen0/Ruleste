[workspace]
resolver = "2"
members = [
    "crates/ruleste-plugin-api",
    "plugins/player",
    "plugins/spring",
    "plugins/lamp",
    "plugins/wire",
    "plugins/spikes",
    "plugins/strawberry",
    "plugins/resortLantern",
    "plugins/spinner",
    "plugins/rotatespinner",
    "plugins/cobweb",
    "plugins/soundsource",
    "plugins/door",
    "plugins/fallingblock",
    "plugins/clutter",
    "plugins/lightbeam",
    "plugins/hanginglamp",
    "plugins/dreamblock",
    "plugins/debris",
    "plugins/refill",
    "plugins/booster",
    "plugins/crushblock",
    "plugins/checkpoint",
    "plugins/cliffflag",
    "plugins/torch",
    "plugins/cloud",
]

[package]
name = "ruleste"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A from-scratch Rust reimplementation of Celeste (SDL3, cross-platform, no game engine frameworks)."
license = "MIT"
default-run = "ruleste"

[dependencies]
ruleste-plugin-api = { path = "crates/ruleste-plugin-api", default-features = false }
wasmtime = "47"
bytemuck = { version = "1", features = ["derive"] }
anyhow = "1"
roxmltree = "0.20"

# SDL3：基础 features 全平台，平台特定查找方式通过 target cfg 叠加
[target.'cfg(unix)'.dependencies]
sdl3 = { version = "0.18", features = ["use-pkg-config", "unsafe_textures"] }

[target.'cfg(windows)'.dependencies]
sdl3 = { version = "0.18", features = ["use-vcpkg", "unsafe_textures"] }

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
