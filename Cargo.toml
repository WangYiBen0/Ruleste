[workspace]
resolver = "2"
members = [
  "crates/ruleste-plugin-api",
  "plugins/badeline-boost",
  "plugins/big-spinner",
  "plugins/booster",
  "plugins/checkpoint",
  "plugins/cloud",
  "plugins/clutter",
  "plugins/crush-block",
  "plugins/dash-block",
  "plugins/decorations",
  "plugins/door",
  "plugins/dream-block",
  "plugins/falling-block",
  "plugins/heart-gem-door",
  "plugins/infinite-star",
  "plugins/intro-car",
  "plugins/intro-crusher",
  "plugins/invisible-barrier",
  "plugins/killbox",
  "plugins/memorial",
  "plugins/npc",
  "plugins/plateau",
  "plugins/player",
  "plugins/refill",
  "plugins/rotate-spinner",
  "plugins/spikes",
  "plugins/spinner",
  "plugins/spring",
  "plugins/star-jump-block",
  "plugins/strawberry",
  "plugins/swap-block",
  "plugins/track-spinner",
  "plugins/trigger-spikes",
  "plugins/zip-mover",
]

[package]
name = "ruleste"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A from-scratch Rust reimplementation of Celeste (SDL3, cross-platform, no game engine frameworks)."
license = "MIT"
default-run = "ruleste"

[dependencies]
ruleste-plugin-api = { path = "crates/ruleste-plugin-api", default-features = false }
wasmtime = "47"
bytemuck = { version = "1", features = ["derive"] }
anyhow = "1"
roxmltree = "0.20"
lewton = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# SDL3：基础 features 全平台，平台特定查找方式通过 target cfg 叠加
[target.'cfg(unix)'.dependencies]
sdl3 = { version = "0.18", features = ["use-pkg-config", "unsafe_textures"] }

[target.'cfg(windows)'.dependencies]
sdl3 = { version = "0.18", features = ["use-vcpkg", "unsafe_textures"] }

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
