[package]
name = "ruleste"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A from-scratch Rust reimplementation of Celeste (SDL3, cross-platform, no game engine frameworks)."
license = "MIT"
default-run = "ruleste"

[dependencies]
ruleste-core = { path = "crates/ruleste-core" }
ruleste-plugins-api = { path = "crates/ruleste-plugins-api", default-features = false }
anyhow = "1"

# SDL3：client 负责窗口与渲染；core 内部仍有输入/音频设备层
[target.'cfg(unix)'.dependencies]
sdl3 = { version = "0.18", features = ["use-pkg-config", "unsafe_textures"] }

[target.'cfg(windows)'.dependencies]
sdl3 = { version = "0.18", features = ["use-vcpkg", "unsafe_textures"] }

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
