[package]
name = "ruleste"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A from-scratch Rust reimplementation of Celeste (SDL3, cross-platform, no game engine frameworks)."
license = "MIT"
default-run = "ruleste"

[dependencies]
ruleste-plugins-api = { path = "crates/ruleste-plugins-api", default-features = false }
wasmtime = "47"
bytemuck = { version = "1", features = ["derive"] }
anyhow = "1"
roxmltree = "0.20"
lewton = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
image = { version = "0.25", default-features = false, features = ["png"] }

# SDL3：基础 features 全平台，平台特定查找方式通过 target cfg 叠加
[target.'cfg(unix)'.dependencies]
sdl3 = { version = "0.18", features = ["use-pkg-config", "unsafe_textures"] }

[target.'cfg(windows)'.dependencies]
sdl3 = { version = "0.18", features = ["use-vcpkg", "unsafe_textures"] }

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
